# Walkie.run — nginx reverse proxy (Next.js on 127.0.0.1:3000) with HTTPS from Let's Encrypt.
upstream walkie_app { server 127.0.0.1:3000; keepalive 32; }
server_tokens off;
limit_req_zone $binary_remote_addr zone=walkie_auth:10m rate=10r/m;   # extra brute-force cushion in front of the app's own limits
limit_req_status 429;

server {
  listen 80;
  listen [::]:80;
  server_name walkie.run www.walkie.run;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://walkie.run$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.walkie.run;
  ssl_certificate /etc/letsencrypt/live/walkie.run/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/walkie.run/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://walkie.run$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name walkie.run;

  ssl_certificate /etc/letsencrypt/live/walkie.run/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/walkie.run/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 6m;   # avatar / admin image uploads

  # never serve dotfiles (.env, .git) or source maps
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.map$ { deny all; }
  location ~ ^/api/auth/(login|signup|forgot|reset) {
    limit_req zone=walkie_auth burst=10 nodelay;
    proxy_pass http://walkie_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # user uploads live outside the build (Next only serves files present at build time)
  location /uploads/ {
    alias /var/www/walkie-data/uploads/;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    expires 30d;
    location ~* \.(php|html?|js|svg)$ { deny all; }
  }

  location /_next/static/ {
    proxy_pass http://walkie_app;
    proxy_set_header Host $host;
    expires 1y;
    access_log off;
  }

  location / {
    proxy_pass http://walkie_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # overwrite (not append): the app's rate limits & hashed-IP risk signals trust the first hop
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
